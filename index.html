<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Race Spectator</title>
<meta name="description" content="Follow your runners around any race course. Upload the GPX, add their start times and goals, and turn the dial to see where they are.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chivo+Mono:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <b>Race Spectator</b>
      <span id="raceLine">Upload a course to start</span>
    </div>
    <button class="tbtn" id="courseBtn" title="Race details or a new GPX">Course</button>
    <button class="tbtn" id="shareBtn" title="Share or load a crew list">Crew</button>
    <button class="tbtn primary" id="addBtn"><span class="hide-sm">Add runner</span><span class="show-sm">+ Runner</span></button>
  </header>

  <div class="stage" id="stage">
    <div id="map" aria-label="Race course map"></div>
    <svg id="overlay" aria-hidden="true">
      <g id="gKm"></g>
      <g id="gSpots"></g>
      <g id="gPin"></g>
      <g id="gRunners"></g>
    </svg>

    <div class="empty-course" id="emptyCourse">
      <div class="drop">
        <b>Drop a GPX file to start</b>
        <span>Your race course, exported from Strava, Garmin or the race website. It stays on this device.</span>
        <button class="tbtn primary" id="pickGpx">Choose GPX file</button>
        <div class="err" id="gpxErr" role="alert"></div>
      </div>
    </div>
    <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml" hidden>

    <div class="dialwrap" id="dialwrap">
      <div class="glass" aria-hidden="true">
        <div class="g-band"></div>
        <div class="g-rim"></div>
      </div>
      <svg class="bezel" id="bezel" viewBox="0 0 200 200" aria-hidden="true">
        <g id="ticks"></g>
        <line class="index" x1="100" y1="3" x2="100" y2="9.5"></line>
        <circle class="grab" id="grab" cx="100" cy="100" r="85" stroke-width="34" tabindex="0"></circle>
      </svg>
      <div class="readout">
        <div class="clock" id="clock">06:30</div>
        <div class="clocksub" id="clocksub">Turn the bezel</div>
      </div>
      <button class="nowbtn" id="nowBtn" data-live="0">Now</button>
    </div>

    <div class="zoomctl">
      <button id="zIn" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
      <button id="zFit" class="fit" title="Fit the whole course" aria-label="Fit the whole course">FIT</button>
    </div>
    <div class="hint" id="hint">Drag the ring to move through the race &middot; tap the course to see who passes</div>
  </div>

  <aside class="panel">
    <h2>
      <span class="tabs" role="tablist">
        <button role="tab" data-tab="runners" aria-selected="true">Runners</button>
        <button role="tab" data-tab="plan" aria-selected="false">My plan <span class="count" id="planCount"></span></button>
      </span>
      <button id="clearBtn">Reset</button>
    </h2>
    <div class="rlist" id="rlist"></div>
    <div class="rlist" id="plist" hidden></div>
  </aside>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/gpx.js"></script>
<script src="js/plan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
