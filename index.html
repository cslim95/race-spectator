<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sydney Marathon Spotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chivo+Mono:wght@300;400;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <b>Sydney Marathon Spotter</b>
      <span>Sun 30 Aug 2026 &middot; 42.195 km</span>
    </div>
    <button class="tbtn" id="shareBtn" title="Share or load a crew list">Crew</button>
    <button class="tbtn primary" id="addBtn">Add runner</button>
  </header>

  <div class="stage" id="stage">
    <svg id="map" preserveAspectRatio="xMidYMid meet" aria-label="Sydney Marathon course map">
      <g id="gWater"></g>
      <g id="gParks"></g>
      <path id="courseHalo" class="course-halo"></path>
      <path id="coursePath" class="course"></path>
      <g id="gKm"></g>
      <g id="gLm"></g>
      <g id="gPin"></g>
      <g id="gRunners"></g>
    </svg>

    <div class="dialwrap" id="dialwrap">
      <div class="glass" aria-hidden="true">
        <div class="g-band"></div>
        <div class="g-rim"></div>
      </div>
      <svg class="bezel" id="bezel" viewBox="0 0 200 200" aria-hidden="true">
        <g id="ticks"></g>
        <line class="index" x1="100" y1="3" x2="100" y2="9.5"></line>
        <circle class="grab" id="grab" cx="100" cy="100" r="85" stroke-width="34" tabindex="0"></circle>
      </svg>
      <div class="readout">
        <div class="clock" id="clock">06:30</div>
        <div class="clocksub" id="clocksub">Turn the bezel</div>
      </div>
      <button class="nowbtn" id="nowBtn" data-live="0">Now</button>
    </div>

    <div class="zoomctl">
      <button id="zIn" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
      <button id="zFit" class="fit" title="Fit the whole course" aria-label="Fit the whole course">FIT</button>
    </div>
    <div class="zlevel" id="zlevel">1.0&times;</div>
    <div class="hint" id="hint">Drag the ring to move through the morning &middot; tap the course to see who passes</div>
  </div>

  <aside class="panel">
    <h2>Your runners <button id="clearBtn">Reset</button></h2>
    <div class="rlist" id="rlist"></div>
  </aside>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script src="js/course-sydney.js"></script>
<script src="js/app.js"></script>
</body>
</html>
